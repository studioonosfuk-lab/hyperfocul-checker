<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風景写真用 過焦点距離チェッカー by 薗英則</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-height: 70px;
            width: auto;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #555;
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 0.85rem;
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #ccc;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #005999;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #252525;
            border-left: 4px solid #007acc;
            border-radius: 4px;
            display: none;
        }
        .result-title {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .result-desc {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.6;
        }
        .sub-result {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #444;
            font-size: 0.85rem;
            color: #bbb;
        }
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="./logo.jpg" alt="薗英則 サイン・ロゴ">
    </div>

    <h1>風景写真用 過焦点距離チェッカー</h1>
    <div class="subtitle">風景写真作家 薗英則 公式ツール</div>

    <div class="card">
        <div class="form-group">
            <label for="sensor">カメラのセンサーサイズ (許容錯乱円 $c$)</label>
            <select id="sensor">
                <option value="0.030">35mmフルサイズ (0.03 mm)</option>
                <option value="0.020">APS-C (0.02 mm)</option>
                <option value="0.015">マイクロフォーサーズ (0.015 mm)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="focalLength">レンズの焦点距離 $f$ (mm)</label>
            <input type="number" id="focalLength" value="200" min="1" max="1000">
        </div>

        <div class="form-group">
            <label for="fNumber">F値 (絞り) $F$</label>
            <input type="number" id="fNumber" value="11" step="0.1" min="1" max="64">
        </div>

        <div class="form-group">
            <label for="focusDistance">被写体・ピント位置の距離 $S$ (m)</label>
            <input type="number" id="focusDistance" value="121" step="0.1" min="0.1" max="10000">
        </div>

        <button onclick="calculateHyperfocal()">計算する</button>

        <div class="result-box" id="resultArea">
            <div class="result-title">計算結果</div>
            <div class="result-value" id="resultValue">--</div>
            <div class="result-desc" id="resultDesc"></div>
            <div class="sub-result" id="depthResult"></div>
        </div>
    </div>

    <div class="footer">
        &copy; Hidenori Sono / ワクワク写真生活
    </div>

    <script>
        function formatDistance(meters) {
            if (isNaN(meters) || !isFinite(meters) || meters > 99999) {
                return "無限遠 (\\(\\infty\\))";
            }
            if (meters < 1) {
                return (meters * 100).toFixed(1) + ' cm';
            } else if (meters < 10) {
                return meters.toFixed(2) + ' m';
            } else {
                return meters.toFixed(1) + ' m';
            }
        }

        function calculateHyperfocal() {
            const delta = parseFloat(document.getElementById('sensor').value);
            const f = parseFloat(document.getElementById('focalLength').value);
            const F = parseFloat(document.getElementById('fNumber').value);
            const S_input = parseFloat(document.getElementById('focusDistance').value);

            if (isNaN(f) || isNaN(F) || f <= 0 || F <= 0 || isNaN(S_input) || S_input <= 0) {
                alert('正しい数値を入力してください。');
                return;
            }

            // 過焦点距離 H (mm単位からメートルに変換)
            // H = f^2 / (F * delta)
            const hMm = (f * f) / (F * delta);
            const hM = hMm / 1000;

            const S = S_input; // ピント位置 (m)

            // 連続被写界深度の計算（前方限界 Dn、後方限界 Df）
            let Dn = (hM * S) / (hM + S);
            let Df;

            if (S >= hM) {
                Df = Infinity;
            } else {
                Df = (hM * S) / (hM - S);
            }

            const resultValue = document.getElementById('resultValue');
            const resultDesc = document.getElementById('resultDesc');
            const depthResult = document.getElementById('depthResult');
            const resultArea = document.getElementById('resultArea');

            resultValue.innerText = `過焦点距離 (H): ${formatDistance(hM)}`;
            resultDesc.innerHTML = `この条件における基準の過焦点距離 $H$ は <strong>約 ${formatDistance(hM)}</strong> です。`;

            let depthText = `<strong>【ピント位置：${formatDistance(S)} の場合の被写界深度】</strong><br>`;
            depthText += `・手前（近点）: <strong>${formatDistance(Dn)}</strong><br>`;
            depthText += `・奥（遠点）: <strong>${formatDistance(Df)}</strong>`;

            if (Math.abs(S - hM) < 1.0) {
                depthText += `<br><span style="color: #4da6ff;">💡 過焦点距離ピッタリに合わせたため、遠点は無限遠、近点は約 ${formatDistance(hM / 2)} になります！</span>`;
            } else if (S < hM) {
                depthText += `<br><span style="color: #4da6ff;">💡 ピントを手前に置いたことで、近点・遠点ともに手前に引き寄った連続被写界深度（パンフォーカス）になります。</span>`;
            }

            depthResult.innerHTML = depthText;
            resultArea.style.display = 'block';
        }
    </script>
</body>
</html>
