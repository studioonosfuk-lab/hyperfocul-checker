<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被写界深度・過焦点距離チェッカー</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-container img {
            max-height: 70px;
            width: auto;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin: 0 0 5px 0;
            color: #ffffff;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-muted);
            margin: 0 0 24px 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-calculate {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-calculate:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            margin-top: 24px;
            padding: 16px;
            background-color: #171717;
            border-left: 4px solid var(--primary-color);
            border-radius: 0 8px 8px 0;
            display: none;
        }

        .result-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-main {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .sub-result-box {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
        }

        .sub-result-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .sub-result-item {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ロゴ画像 -->
    <div class="logo-container">
        <img src="./logo.jpg" alt="薗英則 サイン・ロゴ" onerror="this.style.display='none'">
    </div>

    <h1>被写界深度・過焦点距離チェッカー</h1>
    <p class="subtitle">風景写真作家 薗英則 公式ツール</p>

    <div class="form-group">
        <label for="sensor">カメラのセンサーサイズ (許容錯乱円 c)</label>
        <select id="sensor">
            <option value="0.030">35mmフルサイズ (0.03 mm)</option>
            <option value="0.019">APS-C [Nikon/Sony/Fuji] (0.019 mm)</option>
            <option value="0.020">APS-C [Canon] (0.02 mm)</option>
            <option value="0.015">マイクロフォーサーズ (0.015 mm)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="focalLength">レンズの焦点距離 f (mm)</label>
        <input type="number" id="focalLength" value="200" step="1" min="1">
    </div>

    <div class="form-group">
        <label for="aperture">F値 (絞り) F</label>
        <input type="number" id="aperture" value="11" step="0.1" min="1">
    </div>

    <div class="form-group">
        <label for="subjectDistance">被写体・ピント位置の距離 S (m)</label>
        <input type="number" id="subjectDistance" value="30" step="0.1" min="0.1">
    </div>

    <button class="btn-calculate" onclick="calculate()">計算する</button>

    <div id="resultContainer" class="result-container">
        <div class="result-title">計算結果</div>
        <div class="result-main" id="hyperfocalResult">過焦点距離 (H): --</div>
        <div class="result-desc" id="hyperfocalDesc">--</div>
        
        <div class="sub-result-box">
            <div class="sub-result-title" id="subResultTitle">【ピント位置に応じた被写界深度】</div>
            <div class="sub-result-item" id="nearPoint">・手前 (近点) : --</div>
            <div class="sub-result-item" id="farPoint">・奥 (遠点) : --</div>
        </div>
    </div>

    <div class="footer">
        © Hidenori Sono / ワクワク写真生活
    </div>
</div>

<script>
function calculate() {
    const c = parseFloat(document.getElementById('sensor').value);
    const f = parseFloat(document.getElementById('focalLength').value);
    const F = parseFloat(document.getElementById('aperture').value);
    const S = parseFloat(document.getElementById('subjectDistance').value);

    if (isNaN(c) || isNaN(f) || isNaN(F) || isNaN(S) || f <= 0 || F <= 0 || S <= 0) {
        alert('正しい数値を入力してください。');
        return;
    }

    const H_mm = (f * f) / (F * c);
    const H_m = H_mm / 1000;

    const formatDist = (val) => {
        if (!isFinite(val) || val > 100000) return '無限遠 (∞)';
        if (val < 10) return val.toFixed(2) + ' m';
        if (val < 100) return val.toFixed(1) + ' m';
        return Math.round(val) + ' m';
    };

    document.getElementById('hyperfocalResult').innerText = `過焦点距離 (H): ${formatDist(H_m)}`;
    document.getElementById('hyperfocalDesc').innerText = `この条件における基準の過焦点距離 H は約 ${formatDist(H_m)} です。`;

    let Dn = (H_m * S) / (H_m + S);
    let Df;

    if (S >= H_m) {
        Df = Infinity;
    } else {
        Df = (H_m * S) / (H_m - S);
    }

    document.getElementById('subResultTitle').innerText = `【ピント位置 : ${formatDist(S)} の場合の被写界深度】`;
    document.getElementById('nearPoint').innerText = `・手前 (近点) : ${formatDist(Dn)}`;
    document.getElementById('farPoint').innerText = `・奥 (遠点) : ${formatDist(Df)}`;

    document.getElementById('resultContainer').style.display = 'block';
}
</script>

</body>
</html>
